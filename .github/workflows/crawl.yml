name: crawl

on:
  schedule:
    - cron: '*/30 0-15 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Crawl
        run: node tools/scraper/crawl.mjs --pages 2 --articles 8
      - name: Enrich (AI, needs DEEPSEEK_API_KEY secret)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: node tools/scraper/enrich.mjs --limit 8
        continue-on-error: true
      - name: Commit data
        run: |
          git config user.name 'cau-portal-bot'
          git config user.email 'cau-portal-bot@users.noreply.github.com'
          git add data/
          if git diff --cached --quiet; then
            echo "no changes"
          elif [ -z "$(git diff --cached --name-only | grep -v '^data/index.json$')" ]; then
            echo "only index.json timestamps changed; skip commit"
            git reset -q
          else
            git commit -m "data: auto crawl $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
