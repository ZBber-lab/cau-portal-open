name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install configuration parser
        run: python -m pip install PyYAML==6.0.3

      - name: Install build dependencies
        # The baseline bundles were generated with TypeScript 5.9.3.
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund typescript@5.9.3

      - name: Install MCP dependencies
        run: npm install --prefix tools/mcp --no-package-lock --ignore-scripts --no-audit --no-fund

      - name: Check configuration and credential patterns
        run: python tools/ci/check_repository.py

      - name: Rebuild and compare committed bundles
        run: |
          node build.mjs
          git diff --exit-code -- lib/index.js lib/client.js

      - name: Check JavaScript syntax
        run: python tools/ci/check_syntax.py

      - name: Simulate client loading
        run: node tools/sim-load.cjs

      # 客户端行为夹具：真渲染设置页/面板组件树 + 三条交错场景 + 变异测试（把修复改回旧写法必须变红）
      - name: Check client behaviour fixtures
        run: node tools/client-fixtures.cjs

      - name: Check MCP protocol and six tool results
        run: node tools/mcp/smoke-test.mjs
